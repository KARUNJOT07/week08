name: 00 - Infrastructure (Terraform)

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/00-infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/00-infra.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the Terraform plan (leave unticked for plan only)"
        type: boolean
        default: false

permissions:
  contents: read

# Only one Terraform run at a time, so runs never fight over the state lock
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    shell: bash
    working-directory: infra/terraform

jobs:
  terraform:
    name: Terraform fmt / validate / plan / apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (remote state in Azure Storage)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=week08.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Publish plan to run summary
        run: |
          echo "### Terraform plan (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "~~~" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Plan:|No changes)|# azurerm' plan.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "~~~" >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply (manual approval only)
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        run: terraform apply -input=false -auto-approve tfplan
